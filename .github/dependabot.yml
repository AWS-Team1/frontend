version: 2

updates:
  - package-ecosystem: docker
    directory: /src/frontend

    target-branch: dev

    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul

    open-pull-requests-limit: 1

    groups:
      docker-base-images:
        patterns:
          - "*"

    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

      - dependency-name: ghcr.io/astral-sh/uv
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
